services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://146.190.105.57:8001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6Jeom4ecT_urT-bzQBmxbocgrVHKb3lI1Vl-zErj3ZdOw}
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./services/api/.env
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  ingest:
    build:
      context: ./crates/ingest
      dockerfile: Dockerfile
    env_file:
      - ./crates/ingest/.env
    restart: unless-stopped
